name: media

services:
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/docker/qbittorrent/config:/config
      - /mnt/storage:/data
      # legacy path for torrents added before 2026-11-07 — remove once they finish seeding
      - /mnt/storage/Downloads/torrents:/downloads
    ports:
      - '8080:8080'
      - '62609:62609'
      - '62609:62609/udp'

  bazarr:
    image: ghcr.io/linuxserver/bazarr:latest
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
    volumes:
      - /mnt/storage:/data
      - /home/docker/bazarr/appdata/config:/config
    ports:
      - '6767:6767'

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    restart: unless-stopped
    depends_on:
      - qbittorrent
    environment:
      - TZ=America/Sao_Paulo
      - PORT=5055
      - LOG_LEVEL=info
    volumes:
      - /home/docker/overseerr/config:/app/config  # folder name kept from the Overseerr -> Seerr migration
    ports:
      - '5055:5055'
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

  prowlarr:
    image: ghcr.io/hotio/prowlarr:latest
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/docker/prowlarr/config:/config
    ports:
      - '9696:9696'

  radarr:
    image: ghcr.io/linuxserver/radarr:latest
    restart: unless-stopped
    depends_on:
      - qbittorrent
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/docker/radarr/appdata/config:/config
      - /mnt/storage:/data
      # legacy path for torrents added before 2026-11-07 — remove once they finish seeding
      - /mnt/storage/Downloads/torrents:/downloads
    ports:
      - '7878:7878'

  sonarr:
    image: ghcr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    depends_on:
      - qbittorrent
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/docker/sonarr/appdata/config:/config
      - /mnt/storage:/data
      # legacy path for torrents added before 2026-11-07 — remove once they finish seeding
      - /mnt/storage/Downloads/torrents:/downloads
    ports:
      - '8989:8989'

  plex:
    image: plexinc/pms-docker:latest
    shm_size: '2gb'
    restart: unless-stopped
    group_add:
      - '993'  # render group GID (for /dev/dri/renderD128 access)
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
      - VA_DRIVER=IHD
    volumes:
      - /home/docker/plex/config:/config
      - /home/docker/plex/data:/data
      - /home/docker/plex/transcode:/transcode
      - /mnt/storage/Videos:/media
    devices:
      - /dev/dri:/dev/dri
    network_mode: host
